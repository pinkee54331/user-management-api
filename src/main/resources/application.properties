spring.application.name=user-management-api

spring.datasource.url=jdbc:h2:file:./data/usersdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Google login for Swagger. Create OAuth credentials in Google Cloud Console with the redirect URI
# http://localhost:8080/login/oauth2/code/google and set these environment variables.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

server.servlet.session.cookie.same-site=lax

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
# Placeholder so the Authorize dialog needs no input; the app's own Google login ignores it.
springdoc.swagger-ui.oauth.client-id=swagger-ui
# Keep the token across page refreshes so the dialog still shows Logout.
springdoc.swagger-ui.persist-authorization=true
